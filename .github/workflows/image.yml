# The image plugin-caddy runs as its upstream, from spec's first-party-image workflow (OPS-R93):
# built and run under the posture plugin-caddy's manifest declares on a pull request, and
# published, run again and pinned in plugin-caddy by its rolling pull request from main
# (OPS-R90, OPS-R91, ARCH-R250).
name: image
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  image:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: lemonfiber/spec/.github/workflows/first-party-image.yml@08d30840628cea64ed3a88e477fabebf4d841728 # v1.0.135
    with:
      pinned_in: plugin-caddy
    secrets:
      RELEASE_APP_KEY: ${{ secrets.RELEASE_APP_KEY }}
